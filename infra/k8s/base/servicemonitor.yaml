apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hello-api
  namespace: hello-api
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
